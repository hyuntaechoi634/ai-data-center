name: Figure Studio

on:
  pull_request:
    branches:
      - cht/proj/figure-studio
  push:
    branches:
      - cht/proj/figure-studio
      - 'cht/figure-proposal/**'

permissions:
  contents: read

jobs:
  proposal-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test GitHub proposal boundary
        run: >-
          python3 -m unittest discover
          -s tools/figure-studio/tests
          -v
      - name: Reject restricted publication paths
        run: >-
          python3
          input/gcamdata/ai-data-center/provenance/verify_publication_boundary.py

  exact-proposal-diff:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'cht/figure-proposal/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Check out proposed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposal
      - name: Verify exact reviewed proposal paths
        run: >-
          python3
          base/tools/figure-studio/verify_figure_proposal_diff.py
          --base base
          --proposal proposal
